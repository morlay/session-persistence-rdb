name: release

# 每次 push 到 main：lint + 全量测试（含 PostgreSQL 契约测试）通过后自动发布
# 到 GitHub Packages（npm.pkg.github.com）。版本号需在 push 前手动 bump
# （`nub version`）；版本已存在时跳过发布（CI 不失败）。
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: just lint
      - name: Test
        run: just test
        env:
          TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: just build

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # prepare 生命周期会在 publish 前自动构建；此处显式构建一次兜底
      # （tsdown 幂等且 ~1.5s）。
      - name: Build
        run: just build
      - name: Publish to GitHub Packages
        run: |
          # registry 由 package.json 的 publishConfig 声明；认证 token 写到
          # 全局 ~/.npmrc（nub publish 拒绝脏 working tree，不能覆盖仓库
          # 根的 .npmrc）。
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # 版本已存在（重复 push / 未 bump）时跳过发布，CI 保持绿色；
          # 404（E404）才是「未发布过」，其余 view 错误如实失败。
          if npm view "$PKG@$VERSION" version --registry=https://npm.pkg.github.com/ \
            >/dev/null 2>"$HOME/.view-err"; then
            echo "version $VERSION already published; skip publish"
            exit 0
          fi
          if ! grep -q "E404" "$HOME/.view-err"; then
            cat "$HOME/.view-err"
            rm -f "$HOME/.view-err"
            exit 1
          fi
          rm -f "$HOME/.view-err"
          echo "version $VERSION not published yet; publishing"
          nub publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
